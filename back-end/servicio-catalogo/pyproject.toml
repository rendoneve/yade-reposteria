[project]
name = "servicio-catalogo"
version = "0.1.0"
description = "Repostería: categorías, productos, etiquetas y reseñas"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "sqlalchemy>=2.1",
    "pg8000>=1.31.2",
    "pyjwt>=2.10.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6",
    "boto3>=1.40",
]

[tool.uv]
# PyYAML (lo pide uvicorn[standard]) no tiene versión precompilada para Python 3.15 en Windows
# y este proyecto no lo usa. Con este marcador imposible, uv lo omite y no intenta compilarlo.
override-dependencies = ["pyyaml; sys_platform == 'never'"]
